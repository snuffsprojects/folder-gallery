name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Sharp ${{ matrix.sharp }} / FFmpeg ${{ matrix.ffmpeg }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
        sharp: [false]
        ffmpeg: [false]
        include:
          - node: 22
            sharp: true
            ffmpeg: true
          - node: 24
            sharp: true
            ffmpeg: true
          - node: 22
            sharp: false
            ffmpeg: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install optional image processor
        if: matrix.sharp
        run: npm install --no-save --package-lock=false sharp
      - name: Install optional video processor
        if: matrix.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
        env:
          FOLDER_GALLERY_TEST_SHARP: ${{ matrix.sharp && '1' || '' }}
          FOLDER_GALLERY_TEST_FFMPEG: ${{ matrix.ffmpeg && '1' || '' }}
